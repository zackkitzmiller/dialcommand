[tool.black]
line-length = 80
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "streamcontroller",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
streamcontroller = ["src", "GtkHelper", "globals", "plugins"]
